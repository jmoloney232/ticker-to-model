[project]
name = "ticker-to-model-backend"
version = "0.1.0"
description = "Ticker-to-Model backend: EDGAR ingest, valuation engine, Excel writer, API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "formulas>=1.2",   # recalculates exported workbooks in the Excel parity test
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
