# Filers the pipeline cannot honestly support yet. The app shows the reason
# verbatim instead of a generic error (owner decision, item 5 addendum).
# Data file on purpose — additions here must never require a code change.

- ticker: XOM
  reason: >
    Exxon Mobil tags its annual income statement under custom extension tags
    that standard us-gaap chains cannot see (verified: annual revenue absent
    from every standard revenue tag in its companyfacts). Extension-taxonomy
    support is a later phase.

- ticker: NEE
  reason: >
    NextEra Energy files capital expenditures only under company-specific
    extension tags (verified: no standard us-gaap capex tag carries a value in
    any year — a regulated-utility presentation). Capex is required for a DCF,
    and extension-taxonomy support is a later phase.

- ticker: HSY
  reason: >
    Hershey reports weighted-average shares AND earnings per share only by
    share class in dimensional XBRL, which the SEC companyfacts API strips
    (verified: no undimensioned WA-share or EPS tag in any year). Both the
    direct share chain and the NI÷EPS derivation used for other dual-class
    filers are therefore impossible. Filing-level dimensional XBRL support
    is a later phase.

- ticker: D
  reason: >
    Dominion Energy reports capital expenditures only as a net
    productive-assets flow (payments net of disposal proceeds — verified: no
    gross us-gaap capex tag carries a value in any year). A DCF needs gross
    capex, and treating the net flow as gross would silently fold asset
    sales into reinvestment. Regulated-utility support is a deliberate
    later phase (owner decision, 2026-08-16).

- ticker: ED
  reason: >
    Consolidated Edison files its utility construction spending under a
    rate-regulated presentation (PaymentsForConstructionInProcess) outside
    the standard capex chains (verified FY2025), and regulated-utility
    economics — rate-base reinvestment, regulator-smoothed revenue — sit
    poorly with history-derived defaults. Regulated-utility support is a
    deliberate later phase (owner decision, 2026-08-16).
