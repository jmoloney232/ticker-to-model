# Valuation methodology — single source of truth for every financial convention.
#
# Rendered in three places (one source, no drift):
#   1. the website's /methodology page (spec 06)
#   2. the workbook's Methodology sheet (spec 05)
#   3. referenced throughout specs/04-engine.md
#
# Every entry: what we do (default), where the number comes from (derivation),
# whether the user can change it (editable), and the honest tradeoff (tradeoff).
# The app never silently picks a contested convention — it picks a documented one.

meta:
  version: 0.1.0
  stance: >
    Defaults are derived from the company's own reported history wherever possible,
    are conservative where conventions are contested, and are always user-overridable.

conventions:

  # ── Free cash flow ─────────────────────────────────────────────────────────
  - id: fcf_definition
    label: Free cash flow definition
    category: fcf
    default: "Unlevered FCF = EBIT×(1−tax) + D&A [+ SBC if toggled] − capex − ΔNWC"
    derivation: "All components from the projected statements; NWC excludes cash, ST investments, and all debt"
    editable: false
    tradeoff: "Unlevered (pre-financing) FCF pairs with WACC; levered DCF is out of scope v1."

  - id: sbc_treatment
    label: Stock-based compensation in FCF
    category: fcf
    default: "Expensed — NOT added back (toggle available)"
    derivation: "SBC projected as % of revenue (3y average); toggle re-adds it as non-cash"
    editable: true
    tradeoff: >
      Street practice adds SBC back (higher FCF); treating it as a real expense
      (Damodaran) is conservative and honest about dilution. Owner-confirmed default.
      Expect values to read low vs. typical street DCFs for heavy-SBC issuers.

  # ── Discounting ────────────────────────────────────────────────────────────
  - id: midyear_convention
    label: Mid-year discounting
    category: discounting
    default: "On (toggle available)"
    derivation: "Explicit FCF discounted at period midpoints; see terminal_value entries for the TV treatment"
    editable: true
    tradeoff: >
      Off matches textbooks; on matches practitioner models (cash arrives through the
      year, not on Dec 31). Worth roughly 3–5% of value, larger at higher discount
      rates. The TV treatment is deliberately asymmetric: Gordon TV shifts with
      mid-year (perpetual flows), exit-multiple TV does not (a sale is a year-end
      point event). Practice varies — applying mid-year to both legs is also seen,
      and no authoritative source settles the asymmetry itself; the unit test pins
      the engine's chosen behavior.

  - id: valuation_date
    label: Valuation date & stub period
    category: discounting
    default: "Today, stamped as a literal input (never TODAY() in the workbook)"
    derivation: "Discount exponent = (period midpoint − ValuationDate)/365.25 (mid-year on) or (FYE − ValuationDate)/365.25 (off); exit-multiple TV always uses FYE_N"
    editable: true
    tradeoff: "Discounting from the last fiscal year end silently ignores the elapsed stub; day-count exponents handle mid-year valuation dates correctly and reproduce textbook results when ValuationDate = FYE."

  # ── Cost of capital ────────────────────────────────────────────────────────
  - id: risk_free_rate
    label: Risk-free rate
    category: wacc
    default: "Spot 10Y Treasury (FRED DGS10)"
    derivation: "Latest DGS10 observation, percent→decimal; staleness labeled when cached"
    editable: true
    tradeoff: "Spot is observable and current but embeds today's rate regime in a perpetual-horizon model; a normalized-rate override is supported. 10Y maturity is a documented compromise vs. the perpetual horizon."

  - id: equity_risk_premium
    label: Equity risk premium
    category: wacc
    default: "5.0%, paired with the spot 10Y — a deliberate house combination"
    derivation: >
      The published packages are matched ERP/risk-free PAIRS: Damodaran implied US
      ERP 4.23% (January 2026) paired with the spot 10Y; Kroll recommended US ERP
      5.0% (reaffirmed 2026-01-30) paired with the higher of a normalized 3.5% or
      the spot 20Y. The engine's default combines Kroll's ERP level with
      Damodaran's risk-free convention — defensible, but a third combination
      neither source publishes, and named as such. The damodaran_implied preset
      applies the Damodaran package as published.
    editable: true
    tradeoff: >
      Mixing levels across packages moves the cost of equity: Damodaran's package
      gives a lower Ke than the house default in the current rate environment.
      No observable 'true' ERP exists; what the engine owes the user is naming
      which published package (or house combination) is in force — which the
      preset provenance does.

  - id: beta
    label: Beta
    category: wacc
    default: "2y weekly OLS vs SPY, Blume-adjusted (β_adj = ⅔β + ⅓); toggle for raw; manual override"
    derivation: "Computed in-house from split-adjusted bars (spec 03); ≥80 paired weekly observations required, else β=1.0 fallback with a loud warning"
    editable: true
    tradeoff: >
      Weekly avoids the non-synchronous-trading bias that pulls daily betas toward
      zero; 2y keeps recency (Bloomberg default; Damodaran uses 5y monthly). Blume
      adjustment anticipates mean reversion. Disclosed limitation: a regression beta
      embeds current leverage — projections that change capital structure make it
      silently inconsistent (unlever/relever is a v2 extension). Terminal beta
      convergence (see terminal_beta_convergence) makes the valuation LESS
      sensitive to this estimation window — the stable-period rate is dominated
      by the convergence target — which softens the short-window critique
      without relitigating the choice. The composition is stated openly:
      Blume shrinks estimation error now (⅓ toward 1); the terminal midpoint
      models economic maturation in perpetuity (half the remaining gap) — a
      bounded, disclosed partial double-count of the same mean-reversion
      phenomenon addressing two different things.

  - id: terminal_beta_convergence
    label: Terminal beta convergence (time-varying discount rate)
    category: wacc
    default: "Beta fades linearly from the current estimate to terminal_beta = midpoint(β, 1.0) by the final explicit year; every perpetuity (Gordon TV, EPV's stable phase) capitalizes at the terminal WACC; explicit-year flows discount along the per-year path via a cumulative factor. Weights, Kd, rf, and ERP are held — only the equity-risk component converges"
    derivation: >
      A mature firm in perpetuity is a diversified claim on the economy, and
      a 2-year regression beta is an estimate of present conditions, not a
      permanent property (Damodaran's stable-growth convention brackets
      terminal beta 0.8–1.2). Midpoint rather than full 1.0 because Blume's
      evidence is PARTIAL convergence and full convergence pushed
      half-century-observed low-risk franchises (PG, PEP, CL, KO) 30–40%
      below market in the pre-measurement — an assertion the evidence does
      not support; midpoint also matches the terminal_roic_fade precedent
      and adds no free parameter. Owner-approved 2026-08-17
      (docs/proposals/terminal-beta-convergence.md, with the exact
      pre-measurement). Commissioned by the structural-bias re-measurement:
      gap-to-market correlated −0.49 with WACC and −0.39 with beta after
      every prior fix, and both worsened inside the compounder cohort —
      the cost of capital was the largest documented structural bias.
    editable: true
    tradeoff: >
      Rate structure per surface: explicit years at the per-year path
      (cumulative discount factor, visible row in the workbook); both
      terminal legs discounted along the path with the Gordon denominator
      at the terminal WACC; EPV inherits the full two-phase structure —
      anything else would break the tested g = 0 DCF → EPV convergence and
      make the value-of-growth line a cross-rate-structure comparison. The
      sensitivity grids' WACC axis is a parallel shift of the entire path
      including the terminal rate. The g ≥ WACC hard block and the
      terminal spread floor both bind on the TERMINAL rate — the
      denominator they police. Setting terminal_beta equal to the current
      beta reproduces the single-WACC model exactly (tested reduction
      invariant).

  - id: cost_of_debt
    label: Cost of debt
    category: wacc
    default: "Synthetic rating: 3y avg interest coverage (EBIT÷interest) → rating → default spread → Kd = rf + spread; toggle: embedded rate (interest ÷ avg gross book debt)"
    derivation: >
      Spread table below — Damodaran's LARGE non-financial firms table (the small-cap
      table has different breakpoints), data as of 2026-01; a rating_table_stale flag
      fires when the table is more than 18 months older than the valuation date.
      Disclosed: synthetic rating is a fallback method intended for unrated issuers —
      most companies in this universe carry an actual agency rating the engine does
      not yet ingest (known-limitations, v2). At or above the Caa/CCC bracket a
      synthetic_rating_distressed warning states that the method and the
      going-concern DCF framing are both under strain.
    editable: true
    tradeoff: >
      The embedded coupon measures legacy debt, not marginal refi cost — 3% notes from
      2021 against a 7% refi environment make financing look far cheaper than it is.
      Synthetic rating estimates the marginal rate with no new data. After-taxed at the
      SAME marginal rate as terminal NOPAT (mismatch is a classic silent bug; asserted).
      The distressed brackets run to D at 19% — truncating them would understate Kd
      (and overstate value) exactly for the companies most likely to be worth nothing.
    spread_table_source: "Damodaran, NYU Stern — large non-financial firms"
    spread_table_as_of: "2026-01"
    spread_table:
      - {coverage_above: 8.5,       coverage_upto: 100000,   rating: "Aaa/AAA",  spread: 0.0040}
      - {coverage_above: 6.5,       coverage_upto: 8.499999, rating: "Aa2/AA",   spread: 0.0055}
      - {coverage_above: 5.5,       coverage_upto: 6.499999, rating: "A1/A+",    spread: 0.0070}
      - {coverage_above: 4.25,      coverage_upto: 5.499999, rating: "A2/A",     spread: 0.0078}
      - {coverage_above: 3.0,       coverage_upto: 4.249999, rating: "A3/A-",    spread: 0.0089}
      - {coverage_above: 2.5,       coverage_upto: 2.999999, rating: "Baa2/BBB", spread: 0.0111}
      - {coverage_above: 2.25,      coverage_upto: 2.499999, rating: "Ba1/BB+",  spread: 0.0138}
      - {coverage_above: 2.0,       coverage_upto: 2.249999, rating: "Ba2/BB",   spread: 0.0184}
      - {coverage_above: 1.75,      coverage_upto: 1.999999, rating: "B1/B+",    spread: 0.0275}
      - {coverage_above: 1.5,       coverage_upto: 1.749999, rating: "B2/B",     spread: 0.0321}
      - {coverage_above: 1.25,      coverage_upto: 1.499999, rating: "B3/B-",    spread: 0.0509}
      - {coverage_above: 0.8,       coverage_upto: 1.249999, rating: "Caa/CCC",  spread: 0.0885}
      - {coverage_above: 0.65,      coverage_upto: 0.799999, rating: "Ca2/CC",   spread: 0.1261}
      - {coverage_above: 0.2,       coverage_upto: 0.649999, rating: "C2/C",     spread: 0.1600}
      - {coverage_above: -100000.0, coverage_upto: 0.199999, rating: "D2/D",     spread: 0.1900}

  - id: wacc_weights
    label: WACC weights
    category: wacc
    default: "Equity at market cap (price × current-diluted share proxy); debt at GROSS book value"
    derivation: "Gross debt = short-term + long-term debt incl. finance leases; market value of debt unobservable without bond data — book is the standard proxy for investment-grade names"
    editable: false
    tradeoff: >
      Gross debt in the WACC weights; NET debt appears only in the EV→equity bridge.
      The field is split — net-debt weights are common on the sell side and are
      internally consistent when applied consistently; the engine has CHOSEN gross
      for consistency with its bridge. The real error is inconsistency between the
      weights and the bridge, and that consistency is the tested invariant (P3).
      Book debt is a pragmatic approximation of the textbook market-value weights
      (market-value-of-debt via coupon-bond approximation is a v2 item).

  - id: tax_rate
    label: Tax rate policy
    category: wacc
    default: "Explicit years: 3y effective rate (clamped 10–35%) fading linearly to marginal statutory 25% by the terminal year; terminal NOPAT and after-tax Kd both use marginal"
    derivation: "Effective = income tax ÷ pretax income, 3y average; marginal default 25% (21% federal + state blend), editable"
    editable: true
    tradeoff: "Effective reflects what the company actually pays near-term; marginal is right for the perpetual horizon and the debt tax shield. NOLs and deferred-tax modeling are out of scope v1 (disclosed)."

  # ── Terminal value ─────────────────────────────────────────────────────────
  - id: terminal_growth
    label: Terminal growth rate
    category: terminal_value
    default: "max(1.5%, min(2.5%, 10Y yield)) — a HOUSE CAP, deliberately below the published rule"
    derivation: >
      Anchored to nominal GDP logic (rf ≈ inflation + real growth), floored at 1.5%.
      The published constraint (Damodaran) is g ≤ risk-free — the rf embeds long-run
      growth and inflation assumptions the cash flows should share — and the current
      10Y is displayed beside the default (terminal_growth_rf_ceiling) so the cap
      hides nothing. The 2.5% ceiling is a deliberate conservative deviation, not a
      derivation; in the current rate environment the two differ materially.
    editable: true
    tradeoff: >
      The unfloored g ≤ rf rule breaks under distorted rates — in 2020 it would have
      forced g ≈ 0.7% and cut every valuation 20–30% for reasons unrelated to the
      business. The floor caps that distortion. Warning structure (audit 2026-08-14):
      stated g above the RISK-FREE rate draws the P5 warning (the published
      constraint); stated g above the house cap but at or below rf draws only an
      info-level terminal_g_above_house_cap flag; g ≥ WACC is hard-blocked.

  - id: terminal_spread_floor
    label: Terminal spread floor (WACC − g ≥ 2%)
    category: terminal_value
    floor: 0.02
    default: "The DERIVED terminal-growth default is clamped to TERMINAL WACC − 2% (a no-op for every current filer); user or preset values inside the band draw the terminal_spread_thin warning naming the implied terminal multiple — warned, never clamped; g ≥ terminal WACC stays hard-blocked. Under beta convergence the floor binds on the terminal rate — the perpetuity denominator it polices"
    derivation: >
      Two non-market anchors (docs/proposals/terminal-spread-floor.md,
      owner-approved 2026-08-17): the model's own noise floor — beta standard
      error and the contested ERP put ±1%+ on the cost of equity and g is no
      tighter than ±50bp, so a spread under 2% is inside the joint uncertainty
      of its own inputs — and implied duration, since 1/(WACC − g) is the
      terminal multiple and the order of the value's duration in years (a 1%
      spread asserts century-scale confidence). Structurally, with g ≤ rf and
      a single WACC the spread is already bounded below by roughly
      equity-weight × beta × ERP; the tightest observed spread in the
      supported universe is 2.84% (COST).
    editable: false
    tradeoff: >
      For the record, because the measurement contradicted the motivating
      concern: the rule was proposed against a feared rate instability — that
      the g-at-10Y compounder default would swing low-WACC valuations
      violently as the 10Y moved. Tested and disproved (2026-08-16): rf
      passes through g and WACC in lockstep, the spread is stable across a
      200bp rf range (COST: 2.85% → 2.84% → 2.84%), and ±100bp moves those
      valuations only ±3–5%. The floor exists for the override hole — before
      it, g = WACC − 10bp printed a 1000× terminal multiple with no comment —
      and for future low-beta entrants, not for rate stability.

  - id: terminal_reinvestment
    label: Terminal reinvestment consistency
    category: terminal_value
    default: "Reinvestment rate = g ÷ ROIC_t; TV = NOPAT_{N+1} × (1 − g/ROIC_t) ÷ (WACC − g)"
    derivation: >
      ROIC_t default = trailing 3y mean of marginal-taxed NOPAT ÷ beginning invested
      capital (gross debt + stockholders equity + NCI + preferred + temporary equity
      − cash − ST investments); editable. Degenerate history (invested capital ≤ 0,
      or estimated ROIC ≤ g) falls back to ROIC_t = WACC with a warning stating
      plainly that terminal reinvestment is value-neutral because returns could not
      be estimated.
    editable: true
    tradeoff: >
      Growing year-N FCF at g forever implicitly assumes infinite marginal ROIC —
      quietly inflating TV exactly where TV is 75%+ of value. Tying reinvestment to
      g/ROIC makes terminal growth cost what it should. Requires g/ROIC_t < 1 (hard).
      The WACC fallback (reinvestment earns exactly its cost) adds zero value from
      growth — the honest neutral stance when the data can't support an estimate.
      Holding historical ROIC in perpetuity asserts PERMANENT excess returns —
      Damodaran's stable-growth guidance is the opposite (excess returns decay
      toward zero, ROC toward the cost of capital), though his own Little Book
      allows room for durable competitive advantages, so the default stays
      historical. The terminal_roic_fade toggle (default off) sets ROIC_t to the
      midpoint of derived ROIC and WACC; an explicit user/preset ROIC always wins.
      When derived ROIC exceeds WACC by more than 10pp, an info-level
      terminal_excess_return_persistent flag names the spread regardless of the
      toggle.

  - id: exit_multiple
    label: Exit multiple terminal value
    category: terminal_value
    default: "Company's own current EV/EBITDA × terminal-year EBITDA (comps out of scope v1)"
    derivation: "Current EV = market cap + gross debt − cash − ST investments; trailing EBITDA = EBIT + D&A"
    editable: true
    tradeoff: >
      Using the company's own multiple assumes today's pricing persists — circular-ish
      and labeled as such. Mitigated by the implied cross-check (below), which is the
      standard practitioner discipline and recovers most of the value of comps with no
      new data.

  - id: sensitivity_grids
    label: Sensitivity grid shape
    category: terminal_value
    default: "WACC × terminal g: 5 × 9, WACC ±1.0% at 0.5% steps, g ±1.0% at 0.25% steps; WACC × exit multiple: 5 × 5, ±2.0× at 1.0× steps. Base case is the center cell of each."
    derivation: "Every cell is a full re-computation at that cell's WACC and g/multiple — the g grid re-projects the whole forecast per column (the growth path fades INTO terminal g), never interpolates"
    editable: false
    tradeoff: "Value is convex in g as it approaches WACC, so 50 bp g-steps are coarsest exactly where the grid is most informative; 25 bp is the common practitioner convention. The span stays a symmetric ±100 bp (owner decision 2026-08-14) — a downside-biased span was considered and rejected as a stance the grid shouldn't silently take."

  - id: nominal_gdp_proxy
    label: Nominal GDP proxy (preset constant)
    category: terminal_value
    default: "4.0%"
    value: 0.04
    derivation: >
      ≈ 2% long-run real growth + 2% inflation, round numbers. Used only by the
      damodaran_implied preset's terminal-growth rule min(nominal_gdp_proxy, 10Y);
      the derived default keeps its own house cap. Editable constant: change it
      here and in engine/presets.py NOMINAL_GDP_PROXY (a parity test asserts the
      two match).
    editable: true
    tradeoff: >
      A perpetuity growing faster than nominal GDP eventually IS the economy; the
      proxy caps the preset's g at the economy's own long-run nominal rate, with
      the 10Y as the binding ceiling when rates are lower.

  - id: implied_crosscheck
    label: Implied g ↔ implied multiple cross-check
    category: terminal_value
    default: "Always displayed, both directions"
    derivation: "implied_exit_multiple = TV_gordon ÷ EBITDA_N; implied_g = WACC − FCF_terminal ÷ TV_exit (labeled approximation: holds the Gordon leg's reinvestment fixed)"
    editable: false
    tradeoff: "Shows 'your 12.0× exit implies g = 3.1%' and 'your 2.5% g implies 9.4×' — makes inconsistent terminal assumptions visible instead of disclaimed. Same closed forms in engine and workbook (parity)."

  # ── EV → equity bridge ─────────────────────────────────────────────────────
  - id: excess_cash
    label: Excess cash definition
    category: bridge
    default: "Cash + ST investments above an operating floor of 2% of revenue"
    derivation: "Floor % editable; cash below the floor is operating and stays out of the bridge"
    editable: true
    tradeoff: "Treating ALL cash as excess materially flatters cash-rich names; 2% of revenue is a common operating-cash heuristic (disclosed as a heuristic)."

  - id: ev_bridge
    label: EV → equity bridge
    category: bridge
    default: "EV + excess cash + LT investments − gross debt − NCI (book) − preferred − unfunded pension (after-tax at marginal)"
    derivation: "Each component from the canonical schema; missing optional items are logged, never silent zeros"
    editable: false
    tradeoff: "NCI at book is a disclosed proxy (fair value needs segment multiples — out of scope). Pension after-tax reflects deductibility of contributions."

  - id: share_count
    label: Share count for value per share
    category: bridge
    default: "Current cover-page basic shares × latest-FY (diluted WA ÷ basic WA) ratio"
    derivation: "dei:EntityCommonStockSharesOutstanding × dilution factor from the latest income statement"
    editable: true
    tradeoff: >
      Equity value per share is a point-in-time measure: it needs TODAY'S diluted
      count, not a weighted average over a finished period (WA systematically
      understates the denominator for steady issuers). Full treasury-stock-method
      dilution needs option/RSU footnote data — out of scope v1 — so the latest
      observed dilution ratio applied to current basic shares is the proxy. Owner-reviewed.

  - id: operating_leases
    label: Operating leases
    category: bridge
    default: "Excluded from net debt; liability tracked and disclosed"
    derivation: "Post-ASC 842 operating lease liabilities from the schema; finance leases ARE in debt"
    editable: false
    tradeoff: >
      Including operating leases in debt requires lease-adjusting EBITDA too; v1 keeps
      both sides consistent by excluding them. Magnitude trigger: lease liability >
      25% of gross debt surfaces a warning (retail/restaurant/airline names) — the
      two treatments genuinely diverge there and a footnote isn't sufficient.

  # ── Projections ────────────────────────────────────────────────────────────
  - id: assumption_defaults
    label: Assumption default derivations
    category: projections
    default: "Every default derived from the company's own reported history; every one editable"
    derivation: >
      Revenue growth: 3y CAGR capped at 30% (uncapped CAGR displayed alongside,
      clearly labeled; override upward allowed), faded linearly to terminal g by
      FY5; soft warning above 25%. Margins & opex ratios: 3y averages of per-year
      ratios, D&A-inclusive as filed. DSO/DIO/DPO: 3y averages of 365·AR/rev,
      365·inv/COGS, 365·AP/COGS — by-nature filers substitute total operating costs
      (revenue − EBIT) for COGS, a projection ratio never presented as a comparable
      DIO/DPO figure. Capex: % revenue (3y avg). Depreciation: (D&A − intangible
      amortization) as % of beginning net PP&E (3y avg; see da_basis_split;
      falls back to combined D&A % of revenue if PP&E unmapped). Intangible
      amortization: % of beginning intangibles, run-off. Payout ratio: 3y avg over
      positive-NI years, clamped [0,1]. Interest income yield: 3y avg effective
      yield on beginning cash, clamped [0, rf]. Effective tax: 3y avg excluding
      loss years, clamped [10%, 35%]. Other non-operating income: projected at zero
      (one-offs are not run-rate; the historical column shows them).
    editable: true
    tradeoff: >
      History-derived defaults are traceable and defensible but assume continuity;
      the fade to terminal g imposes maturity. The 30% growth cap keeps the default
      defensible — "the company grew 60%, so we assumed 60%" is not a derivation
      anyone can stand behind — while the displayed uncapped CAGR keeps it honest.
      Every derivation string is shown next to its input in the UI and workbook.

  - id: da_placement
    label: D&A placement in projections
    category: projections
    default: "Cost lines projected D&A-inclusive as filed; EBIT = revenue − cost lines; roll-forward D&A is a memo line used only for the CF add-back, the PP&E roll, and EBITDA"
    derivation: "Filed cost lines already contain D&A (filers embed depreciation in COGS/SG&A and do not split it out); projecting D&A-inclusive ratios plus a separate D&A line would double-count and understate EBIT for every filer"
    editable: false
    tradeoff: >
      All statement identities hold exactly. The disclosed nuance: the D&A embedded
      in the cost ratios and the memo D&A from the PP&E roll can drift apart in
      later projection years (memo D&A follows the capex path, embedded D&A follows
      revenue), so late-year EBITDA margins shift slightly rather than staying pinned.

  - id: da_basis_split
    label: Depreciation vs. intangible amortization (split basis)
    category: projections
    default: "Depreciation = (D&A − intangible amortization) as % of beginning net PP&E drives the PP&E roll; amortization of intangibles runs the existing intangibles balance off at its own derived rate and then stops; the D&A memo is their sum"
    derivation: >
      Subtraction, never the filer's Depreciation tag (under-inclusive tags —
      finance-lease amortization and similar — corrupt a tag-based rate).
      A combined rate against PP&E alone made the roll a divergent recurrence
      for amortization-heavy serial acquirers: a filer whose D&A is dominated
      by acquired-intangible amortization against a small physical asset base
      (worst observed: 323% of beginning PP&E) projected oscillating negative
      PP&E and meaningless cash flows. Depreciation is additionally capped at
      beginning PP&E plus capex — an accounting identity (net PP&E cannot
      fall below zero), not a tuned threshold — and the cap is disclosed
      whenever it binds (ppe_roll_floor).
    editable: true
    tradeoff: >
      Run-off treatment (owner decision, 2026-08-16): the existing balance
      amortizes with its add-back, then both stop — matching the forecast's
      no-M&A stance. The street alternative adds amortization back in
      perpetuity (treats it as pure accounting fiction); the conservative
      alternative never adds it back (treats embedded amortization as a real
      cost). Run-off sits between: past deals' amortization is genuinely
      non-cash, but perpetual add-back would invent future acquisitions'
      amortization without their revenue. Because cost ratios stay as filed,
      EBIT keeps carrying the amortization embedded in history after the
      run-off ends — deliberately conservative for serial acquirers. When the
      filer does not tag intangible amortization separately, the combined
      basis is retained and disclosed (amortization_unobservable) whenever
      intangibles exceed 25% of net PP&E — the same constant as the
      lease-magnitude disclosure.

  - id: assumption_presets
    label: Assumption presets
    category: assumptions
    default: "derived (the identity case); built-ins: market_implied, street_convention, downside, damodaran_implied — full definitions, rationales, and per-field rules render automatically from engine/presets.yaml"
    derivation: "A preset is a stated methodology: name + one-line rationale + a derivation rule per field, held to the same standard as the derived defaults (no hand-picked numbers). Strict layering: derive from history → apply preset → apply user overrides; every assumption carries provenance (derived | preset:<name> | user) in the CLI, the UI, and the workbook's assumptions sheet"
    editable: true
    tradeoff: >
      Presets transform derived defaults, never replace the derivation; they
      pass the same domain validation as user overrides, never bypass model
      validation (terminal g ≥ WACC still blocks, whichever preset requested
      it), and never suppress inherited warnings. A preset that cannot be
      applied to a filer says so with the reason — market_implied reports
      "no solution below WACC" rather than falling back to a different lever
      or an extreme value.

  - id: unclassified_costs
    label: Unclassified operating costs (margin-identity closure)
    category: projections
    default: "unclassified_costs_pct = 3y mean of (revenue − EBIT − Σ named cost lines) / revenue, projected as an explicit cost line; warning above 1% of revenue naming the percentage"
    derivation: "Operating costs attributable to no named line item are real costs; omitting them projects a fictional margin. The closure line makes projected EBIT margin reproduce the filer's own historical margin structure by identity — for most filers it derives to ~0 and is inert"
    editable: true
    tradeoff: >
      Without this line, a filer whose costs live in tags the schema doesn't map
      (MCD's company-operated restaurant costs, ~$11.5B) projected an 89% EBIT
      margin against a real 46% — a credibility-ending bug caught by the
      diagnostic pass. The line is deliberately unnamed rather than guessed into
      a category: an honest "unclassified" beats a wrong "SG&A". The lasting fix
      per filer is a tag-chain addition; the warning names the gap so those
      filers are findable.

  - id: negative_terminal_anchor
    label: Negative terminal anchors — honest unavailable state
    category: terminal_value
    default: "Gordon leg unavailable when terminal NOPAT ≤ 0; exit leg unavailable when projected FY5 EBITDA ≤ 0; each with a warning naming the anchor. Reverse DCF remains available"
    derivation: "A perpetuity on a negative base (or a multiple of negative EBITDA) is a sign error dressed as a number; valuing a loss-making base year requires an explicit recovery view, which is the user's to state, never a default"
    editable: false
    tradeoff: >
      The model declines to print a value for filers like BA's loss window rather
      than printing a negative one. A positive-but-tiny anchor (KHC after
      impairments) is not guarded: EV below gross debt is a legitimate statement
      that the equity is worth ~nothing at these assumptions, and it prints as
      such. The reverse DCF stays available either way — the implied recovery
      margin is most informative exactly when the forward model refuses.

  - id: reinvestment_fade_warning
    label: Reinvestment-fade mismatch warning
    category: projections
    default: "Warn when final-year capex > 1.5× memo depreciation (D&A minus intangible amortization) while final-year revenue growth is within 1.0pp of terminal g; capex is never auto-faded"
    derivation: >
      capex_pct is a flat 3y mean held across the forecast while growth fades to
      terminal g — a company decelerating to ~2.5% growth while reinvesting at its
      hypergrowth rate is internally inconsistent, and the warning names both numbers.
    editable: false
    tradeoff: >
      The obvious fix — forcing capex toward D&A parity — is itself contested:
      capex-equals-depreciation is only valid under no growth and no inflation
      (Matthews & Rosenbloom), and survey capex typically exceeds depreciation. So the
      engine warns instead of auto-fading, and points at the street_convention preset
      (midpoint fade to depreciation parity — depreciation-only basis, since
      intangible amortization is not replaced by capex) as the opinionated
      expression of a fade. The trigger moved to the depreciation basis on
      2026-08-17 (owner-approved) once the structural-bias re-measurement had
      landed — the deferral existed so profile membership stayed stable
      during that measurement, and the flip effects are pinned in tests.

  - id: unobservable_interest
    label: Unobservable interest lines
    category: projections
    default: "Interest expense zero-logged with material debt: imputed at the synthetic Kd with a warning. Interest income zero-logged: 0% yield with a warning"
    derivation: "AAPL-shape filers stopped separately disclosing interest lines; the debt is real even when its cost is untagged"
    editable: true
    tradeoff: >
      The asymmetry is deliberate: omit unobservable income, impute unobservable
      expense — both choices are conservative for the valuation. Projecting $0
      interest on $90B+ of debt would fabricate pretax income; projecting fabricated
      interest income on cash would inflate it. Each treatment carries a visible
      warning, never a silent default.

  - id: forecast_horizon
    label: Explicit forecast horizon
    category: projections
    default: "5 years (selectable: 5, 7, or 10)"
    derivation: >
      Every fade (revenue growth to terminal g, effective to marginal tax) reaches
      its terminal level in the final forecast year; discount exponents, terminal
      values, and both sensitivity grids re-compute at the selected horizon. The
      exported workbook is laid out at the model's horizon — the forecast_years
      cell in the sheet is structural, so the horizon changes in the app, not in
      the workbook.
    editable: true
    tradeoff: >
      Koller et al. recommend extending the explicit forecast until the company
      actually reaches steady state — a fixed 5 years forces every business to
      mature by FY5 and mechanically raises the terminal-value share (P8). But a
      mechanically extrapolated linear fade over 10–15 years with no analyst
      judgment can be worse than a short horizon, so 5 stays the default and the
      UI does not recommend longer.

  - id: projection_mechanics
    label: Projection mechanics
    category: projections
    default: "Cash is the balance-sheet plug (no revolver); interest on BEGINNING-of-period balances; debt constant; dividends at payout ratio; no buybacks; shares constant"
    derivation: "Beginning-balance interest eliminates circularity — the exported workbook never needs iterative calculation (hard requirement)"
    editable: false
    tradeoff: "A revolver is unnecessary for cash-generative large caps in scope; a deeply negative cash plug raises a warning instead of fabricating financing. P&L interest uses the embedded legacy-debt rate; WACC uses the marginal (synthetic) rate — different questions, both documented."

  # ── Data policies ──────────────────────────────────────────────────────────
  - id: restatement_policy
    label: Restatement policy
    category: data
    default: "Latest-filed accession wins (as-restated history)"
    derivation: "Per (concept, period): max filed date across accessions; >1% delta vs first-filed → visible warning"
    editable: false
    tradeoff: "As-restated is the right basis for forecasting; as-originally-reported preserves point-in-time knowledge (useful for backtesting — out of scope). Restatements surface as warnings, never silently."

  - id: fiscal_calendar
    label: Fiscal calendars & 53-week years
    category: data
    default: "Annual periods anchored to the filer's FYE; 53-week years detected (≥371 days) and annotated, not normalized"
    derivation: "A 53rd week inflates apparent growth ~1.9%; the annotation keeps growth comparisons honest"
    editable: false
    tradeoff: "Normalizing to 52 weeks would touch every line item for a ~2% effect; v1 discloses instead."

  - id: market_data
    label: Market data policies
    category: data
    default: "Split-adjusted bars only; SPY as market benchmark; degradation ladder live → cache → snapshot, always labeled"
    derivation: "Raw bars turn a split into a fake return that destroys the beta regression; staleness is shown wherever cached data is used"
    editable: false
    tradeoff: "SPY (investable, dividend-inclusive via total-return approximation limits disclosed) vs. the index itself: immaterial for beta at this scope."

  - id: cash_reconciliation_materiality
    label: Cash-flow reconciliation materiality
    category: data
    default: "An unreconciled cash residual below 1% of revenue AND 5% of gross cash flows is disclosed per year (dollars and percentages), not fatal; above either leg the model refuses to build"
    derivation: "The auditor's treatment of an immaterial difference: quantify, disclose, move on. 1% of revenue is the top of the standard audit materiality range; the flows leg catches residuals small vs revenue but large vs actual cash movement. Calibrated on a 29-filer scan (owner-approved)"
    editable: false
    tradeoff: >
      Strict zero-tolerance rejects real filers over $1B FX/restricted-cash
      presentation quirks against $600B of revenue; a loose threshold would wave
      through structural breaks (GE's spin year, at 1.27% of revenue, still fails).
      Residuals are always visible — disclosure is the mechanism, not forgiveness.

  - id: coverage_gate
    label: Balance-sheet coverage gate
    category: data
    default: "Below 60% of assets or liabilities mapped to named line items: no valuation, with the largest unattributed balances named. 60–85%: builds behind a hard, non-dismissible warning"
    derivation: "Coverage = share of the latest balance sheet attributable to named items rather than derived residual buckets; floors calibrated on a 29-filer scan where the distribution is bimodal (owner-approved)"
    editable: false
    tradeoff: >
      A filer that builds badly is more dangerous than one that fails — nothing
      signals distrust. The gate refuses captive-finance balance sheets (Deere: 20%
      mapped) rather than valuing a fifth of a company, while bounded gaps (NVIDIA:
      73%, dominated by a disclosed combined-investments line) build with a warning.

  - id: driver_ranking
    label: Headline-driver ranking
    category: mechanics
    default: "The Summary tab's five headline drivers are ranked by actual impact for the company at hand: mean absolute per-share move of the headline valuation leg under a standardized ± step of each editable assumption"
    steps: {rate: 0.01, ratio: 0.01, x: 0.5, days: 5.0}
    wacc_step: 0.01
    top_n: 5
    derivation: >
      Uniform steps by unit — ±1pp for rates and ratios, ±0.5× for multiples,
      ±5 days for working-capital days — each side engine-recomputed, averaged,
      clamped to the valid domain (one-sided at an edge). WACC appears as one
      composite driver swept directly (the concept the reader prices in); its
      inputs — beta, ERP, the risk-free rate, cost-of-debt inputs — are not
      listed separately, so one concept is never double-counted.
    editable: false
    tradeoff: >
      Uniform steps are transparent and comparable but treat a 1pp margin move
      and a 1pp revenue-growth move as equally likely, which they are not.
      The alternative — steps scaled to each company's own historical
      volatility — ranks "realistically" but is opaque and unstable across
      refreshes. Transparency wins (owner decision 2026-08-15); the step is
      printed beside every driver so nothing is implied.

  - id: value_curves
    label: Slider value curves
    category: mechanics
    default: "A slider on the dashboard reads a precomputed curve of at least 25 engine-computed (assumption value, per-share value) points spanning the valid domain, holding every other current assumption fixed"
    curve_points: 25
    derivation: >
      The browser performs no valuation math — during a drag the slider snaps
      to engine-computed points (landmarks such as the derived default, the
      market-implied value, and the risk-free rate are inserted as exact
      points), and the authoritative full recompute fires on release. A CI
      test asserts sampled curve points equal a full model rebuild at that
      value. The terminal-growth track is draggable to WACC − 25bp (the
      engine's hard block); crossing the 10Y is warned, not blocked, matching
      the published g ≤ rf rule.
    editable: false
    tradeoff: >
      Precomputing on the server costs one curve per response (~25 cheap
      Gordon-leg evaluations) and guarantees the browser can never disagree
      with the engine; client-side interpolation would be faster still but
      would put valuation math in the frontend, which this project forbids.

  - id: company_profiles
    label: Company profile classifier
    category: assumptions
    default: "Every filer is classified from its own reported history — primary profile (compounder / mature / declining) from growth trajectory and excess returns, plus modifiers (cyclical, reinvestment-heavy) — and the DERIVED defaults adapt to it. Layering stays derived (profile-aware) → preset → user override; the profile, its trigger measurements, and any reassignment are always disclosed"
    thresholds:
      inflation_proxy: 0.02
      compounder_cagr_min: 0.08
      compounder_latest_min: 0.04
      excess_return_min: 0.05
      margin_range_min: 0.06
      capex_da_min: 1.5
      capex_da_cap: 4.0
      dep_ppe_floor: 0.04
    derivation: >
      Declining: full-window revenue CAGR and the latest year both below 2%
      (≈ inflation — nominal growth below it is real shrinkage; both legs so
      one soft year cannot reclassify). Compounder: CAGR ≥ 8% (2× the
      nominal-GDP proxy — growth economic-share retention cannot explain),
      latest year ≥ 4% (still growing at trend — a post-shock rebound is not
      a compounder), median ROIC − WACC ≥ 5pp (outside invested-capital
      measurement noise), and ROIC above WACC in every observed year
      ("durably", literally). Mature is the fallback — boundary cases get
      the conservative treatment. Cyclical modifier: EBIT-margin range ≥ 6pp
      AND at least one revenue down-year (margin volatility without a
      top-line contraction is a cost story, not a cycle). Reinvestment-heavy:
      capex/depreciation ≥ 1.5× (the reinvestment_fade_mismatch trigger —
      same published constant). Above 4× the ratio needs explaining, and the
      two explanations get opposite treatments (separated 2026-08-17,
      owner-directed): a SUSPECT BASE — depreciation anomalous relative to
      the asset base, tested as minimum per-pair depreciation / beginning
      net PP&E below 4%, since an implied asset life beyond 25 years cannot
      coexist with spending ≥ 4× depreciation on the same assets (MCD's
      lessee-D&A at 1.7%, CSCO's collapsed D&A-minus-amortization at ~0%)
      — withholds the modifier, disclosed. A REAL SURGE — spending anomalous
      relative to the company's own history while depreciation stays healthy
      against the asset base (ORCL ~18% ≈ 6-year server life, TXN ~16%,
      LLY ~9%) — earns the modifier like any other crosser, disclosed. In
      the measured universe the two populations sit either side of a wide
      empty band (suspect crossers ≤ 1.8%, genuine ≥ 8.8%); the 4% floor
      lies in the gap with slack on both sides, placed by what the claim
      means, not by any valuation outcome.
      Depreciation basis — D&A minus intangible amortization, same
      subtraction and observability guard as da_basis_split — since
      2026-08-17 (owner-approved after the structural-bias re-measurement):
      amortization in the denominator suppressed the modifier for serial
      acquirers and understated cap crossings. A profile may set
      only: forecast horizon, terminal growth default, margin normalization,
      capex normalization. Never WACC components, the bridge, or validation
      thresholds. (Growth fade shape left this list 2026-08-16 — see
      growth_fade_shape.)
    editable: true
    tradeoff: >
      Thresholds are set from what the categories mean, never from fit
      against market prices (owner rule) — the boundaries were placed by
      inspecting where the feature distributions separate across a 27-filer
      scan, and no placement was informed by any valuation gap. Uniform
      defaults were simpler but made the model's error predictable from
      company characteristics (gap correlating −0.68 with WACC), which is a
      defect, not a view. The classification is user-reassignable and the
      reassignment is disclosed in provenance.

  - id: growth_fade_shape
    label: Growth fade shape
    category: assumptions
    default: "Linear fade from FY1 growth to terminal g, every profile"
    derivation: >
      One shape, no shape parameter. A half-cosine variant for compounders
      (front-loaded persistence, kink-free landing) existed until 2026-08-16;
      the profile decomposition audit measured its worth at ≤ $2/share across
      the entire compounder cohort — roughly $1 on most names — so it was
      removed by owner decision: a rule that earns no economic payload is
      complexity sitting in the codebase inviting "why is this here?". The
      compounder profile now differs from the base conventions by exactly
      two disclosed levers: the 10-year horizon and terminal g at the 10Y
      ceiling.
    editable: false
    tradeoff: >
      The linear fade understates the near years for a durable franchise and
      hands into the perpetuity with a slope kink; both effects were measured
      and are worth ~$1/share. A power-family fade with a shape exponent was
      rejected because the exponent would be a tunable free parameter — the
      same reasoning that removed the cosine cuts against replacing it.

  - id: capex_normalization
    label: Capex normalization (reinvestment-heavy)
    category: assumptions
    default: "OFF unless the reinvestment-heavy modifier applies: capex % of revenue fades linearly from the trailing rate to maintenance — trailing 3y depreciation/revenue × (1 + terminal g), depreciation-only basis since run-off amortization is not replaced by capex — by the final forecast year"
    derivation: >
      Capex persistently ≥ 1.5× depreciation means the asset base grows materially
      faster than it depreciates — held flat forever, that contradicts the
      terminal growth rate (exactly what the reinvestment_fade_mismatch
      warning flags; this is that warning's documented remedy). The
      maintenance target is replacement burden plus the growth increment;
      perpetual reinvestment beyond the horizon is governed by
      RR = g/ROIC, not this line.
    editable: true
    tradeoff: >
      Fading to maintenance raises explicit-window FCF for exactly the
      companies whose recent capex is elevated — defensible when the spend
      is expansion, wrong if the elevated rate IS maintenance (undepreciated
      asset inflation). The toggle and target are both editable and the
      fade is visible year-by-year in the workbook.

  # ── Valuation methods (the registry) ───────────────────────────────────────
  - id: valuation_methods
    label: Valuation methods
    category: valuation
    default: "Three independent methods, each with its own availability state and the SAME EV → equity bridge: DCF — Gordon perpetuity, DCF — exit multiple, and Earnings Power Value (no growth). The reverse DCF is not a method — it solves for implied assumptions rather than producing a value"
    derivation: >
      Every method reports enterprise value, per-share value, and its bridge,
      or an honest unavailable state with a machine-readable reason. Display
      order is part of the registry (engine), never the frontend. Methods
      share the discount rate and the bridge so their disagreement isolates
      the growth and terminal assumptions, not plumbing differences. On the
      website the methods are grouped into two selectable views (owner
      decision 2026-08-16) — DCF (both DCF legs, the projection machinery)
      and Earnings power (EPV alone, exposing only the assumptions EPV
      actually consumes; that field list is perturbation-tested against the
      engine). The workbook is never split: one file always carries every
      method.
    editable: false
    tradeoff: >
      A single blended number would be tidier and is deliberately not
      offered: the methods answer different questions, and the spread
      between them is information (see value_of_growth), not noise to
      average away.

  - id: epv_method
    label: Earnings Power Value (EPV)
    category: valuation
    default: "EPV enterprise value = FY0 revenue × normalized EBIT margin × (1 − marginal tax), as a FLAT stream discounted along the same beta-convergence rate path as the DCF: the explicit window as an annuity of the discount-factor row, the stable period capitalized at the terminal WACC (two-phase, owner-approved 2026-08-17; same mid-year/stub flow timing as the explicit years)"
    derivation: >
      Greenwald-style no-growth valuation: capitalize today's demonstrated
      earnings power at the cost of capital. The marginal tax rate is used —
      the same rate as terminal NOPAT and after-tax Kd — because a
      perpetuity should carry the ongoing rate, not a 3y effective rate that
      embeds one-offs. EPV deliberately shares the DCF's FULL rate
      structure, including terminal beta convergence: the regression beta
      is an estimate of present conditions for EPV too, and any other rate
      treatment would break the convergence invariant below and make
      "value of growth = Gordon − EPV" a comparison across two different
      rate structures. A negative normalized EBIT makes EPV unavailable
      with a reason (the same rule as the negative terminal anchor).
      Property-tested invariant: a DCF with zero growth in every year, zero
      terminal growth, capex equal to D&A, and flat working capital
      converges to the EPV cell exactly.
    editable: true
    tradeoff: >
      EPV embeds no view of the future, which is both its value (an anchor
      free of growth assumptions) and its limit (it prices durable growth at
      zero). For heavy-R&D compounders it understates steady-state earnings
      power because growth investment is expensed through EBIT — the
      Greenwald adjustment (capitalizing part of growth spending) is a named
      future refinement, not attempted in v1.

  - id: epv_margin_normalization
    label: EPV margin normalization (by profile)
    category: valuation
    default: "Normalized EBIT margin applied to FY0 revenue — mature and compounder: trailing 3y mean; cyclical modifier: full observed window mean; declining: full-window MEDIAN. When declining and cyclical collide, declining wins"
    rules:
      mature: trailing_3y_mean
      compounder: trailing_3y_mean
      cyclical: full_window_mean
      declining: window_median
      collision: declining_wins
    derivation: >
      Cyclical filers average across the full window because capitalizing
      one phase of the cycle is the classic cyclicals error. Declining
      filers use the latest year: older margins reflect scale the business
      no longer has, and trend-adjusting would smuggle a forecast into a
      no-growth method — the decline belongs in the DCF − EPV gap, where it
      shows up as negative value of growth. Compounders keep the trailing
      3y mean rather than the (typically peak) latest year: mildly
      conservative for a rising-margin business, which is the right
      direction for a no-growth number, and it keeps the growth-value
      comparison clean. Declining beats cyclical because secular decline
      means old cycle peaks are not coming back. Note the DCF's own cost
      lines still use the full-cycle window for declining+cyclical filers —
      a projection of cost structure and a capitalization of current
      earnings power are different questions.
    editable: true
    tradeoff: >
      Any single window is contestable; the choice is disclosed per profile
      and the margin itself is an editable assumption (epv_margin) with the
      rule in its provenance. Owner-approved 2026-08-15.

  - id: epv_maintenance_capex
    label: EPV maintenance capex
    category: valuation
    default: "Maintenance capex = D&A; working capital held flat (no growth to fund)"
    derivation: >
      The standard EPV simplification: a no-growth business spends only what
      sustains the asset base. Under it, no-growth FCF = NOPAT exactly — D&A
      cancels out of the number entirely, so EPV reduces to a perpetuity on
      normalized NOPAT and needs no capex estimate. (A side effect: EPV is
      immune to distortions in the D&A-on-PP&E convention for
      amortization-heavy filers.)
    editable: false
    tradeoff: >
      True maintenance capex can sit above D&A (asset inflation) or below it
      (amortization of acquired intangibles that needs no cash replacement).
      A refined maintenance-capex estimate is a documented future
      refinement, deliberately not attempted in v1 — the simplification is
      stated here and on the workbook's EPV block.

  - id: value_of_growth
    label: Value of growth (DCF − EPV)
    category: valuation
    default: "Gordon DCF per share − EPV per share, also expressed as a share of the DCF value. Comparator is the Gordon leg only"
    derivation: >
      Both are intrinsic perpetuity-family values sharing WACC and the
      bridge, so their difference isolates what the growth and terminal
      assumptions are worth; the exit-multiple leg is market-anchored and
      would mix an intrinsic and a market number. When EPV exceeds the DCF
      the state is labeled value-destructive — the projected path earns less
      than holding today's profits flat (returns below the cost of capital,
      or shrinkage) — and is never rendered as a negative "value of growth".
      Unavailable whenever either input method is, with the reason carried
      through.
    editable: false
    tradeoff: >
      The split is only as good as the EPV normalization behind it; for
      expensed-growth compounders the growth share reads high because EPV
      reads low (see epv_method). It is a decomposition of this model's own
      numbers, not evidence about the market's view.
